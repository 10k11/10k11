name: Update Discord Presence Card

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build card from Lanyard
        run: python .github/scripts/discord_card.py dist/discord.svg

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: discord
          build_dir: dist
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
