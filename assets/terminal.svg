<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; }
      .p { fill: #00F5FF; } .c { fill: #c9d1d9; } .o { fill: #7B2FF7; } .g { fill: #3fb950; } .d { fill: #8b949e; }
      .l { opacity: 0; animation: show 0.01s forwards; }
      .l1 { animation-delay: 0.4s; } .l2 { animation-delay: 1.3s; } .l3 { animation-delay: 2.2s; }
      .l4 { animation-delay: 3.1s; } .l5 { animation-delay: 4.0s; } .l6 { animation-delay: 4.9s; }
      .l7 { animation-delay: 5.8s; }
      @keyframes show { to { opacity: 1; } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 4s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(300px); } }
      .border { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 50% { stroke-opacity: .35; } }
    </style>
  </defs>
  <rect x="2" y="2" width="816" height="296" rx="12" fill="#0D1117" stroke="url(#g)" stroke-width="2" class="border"/>
  <rect x="2" y="2" width="816" height="34" rx="12" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/><circle cx="44" cy="19" r="6" fill="#ffbd2e"/><circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="410" y="24" text-anchor="middle" class="d" style="font-size:12px">loki@localhost969: ~</text>

  <g filter="url(#glow)">
    <g class="l l1"><text x="24" y="68"><tspan class="p">loki@localhost969</tspan><tspan class="c">:~$ </tspan><tspan class="g">whoami</tspan></text></g>
    <g class="l l2"><text x="24" y="92" class="c">LOKI | Full-Stack Developer | CTF Player</text></g>
    <g class="l l3"><text x="24" y="124"><tspan class="p">loki@localhost969</tspan><tspan class="c">:~$ </tspan><tspan class="g">cat mission.txt</tspan></text></g>
    <g class="l l4"><text x="24" y="148" class="c">Build web apps. Break web apps. Ship security tools.</text></g>
    <g class="l l5"><text x="24" y="180"><tspan class="p">loki@localhost969</tspan><tspan class="c">:~$ </tspan><tspan class="g">ls ./stack</tspan></text></g>
    <g class="l l6"><text x="24" y="204"><tspan class="o">typescript/  node/  react/  python/  docker/  burpsuite/  linux/</tspan></text></g>
    <g class="l l7"><text x="24" y="236"><tspan class="p">loki@localhost969</tspan><tspan class="c">:~$ </tspan><tspan class="cur c">&#9608;</tspan></text></g>
  </g>
  <g clip-path="inset(0)">
    <rect class="scan" x="4" y="0" width="812" height="40" fill="#00F5FF" opacity="0.04"/>
  </g>
</svg>
